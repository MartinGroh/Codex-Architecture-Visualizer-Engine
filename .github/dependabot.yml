version: 2
updates:
  - package-ecosystem: npm
    directory: /src/Cave.Ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # React and its renderer must have matching runtime versions.
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
