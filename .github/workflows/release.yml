name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package release
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Cave.Ui/package-lock.json
      - name: Audit current tree
        shell: pwsh
        run: ./scripts/audit-public-readiness.ps1
      - name: Verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $expectedTag = "v$((Get-Content -LiteralPath VERSION -Raw).Trim())"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag '$env:GITHUB_REF_NAME' does not match '$expectedTag'."
          }
      - name: Build, test, and package
        shell: pwsh
        run: ./scripts/package-release.ps1
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cave-release-${{ github.sha }}
          path: artifacts/releases/*
          if-no-files-found: error
      - name: Create draft GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assetPaths = @(Get-ChildItem -LiteralPath artifacts/releases -File | ForEach-Object FullName)
          gh release create $env:GITHUB_REF_NAME @assetPaths --draft --verify-tag --generate-notes
