name: Wiki

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish reviewed wiki source
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configure GitHub authentication
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Synchronize wiki
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-wiki.ps1 -Repository ${{ github.repository }} -Apply
