version: 2
updates:
  - package-ecosystem: npm
    directory: /src/Cave.Ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # React and its renderer must have matching runtime versions.
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
    ignore:
      # CI and the supported local toolchain use Node 24; newer types claim APIs it cannot run.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
