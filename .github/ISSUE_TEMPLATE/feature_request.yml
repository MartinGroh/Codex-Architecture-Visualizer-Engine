name: Feature request
description: Propose a focused user outcome.
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem is not solved today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe success without prescribing implementation.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and alternatives
      description: What have you tried, and what existing behavior is relevant?
  - type: textarea
    id: boundaries
    attributes:
      label: Architecture, privacy, and compatibility impact
      description: Note possible owners, evidence sources, data collection, network behavior, packaging, and rollback.
  - type: checkboxes
    id: agreement
    attributes:
      label: Contribution intent
      options:
        - label: I searched existing issues and WANTED.md.
          required: true
        - label: I will open a design issue before implementing a new boundary, storage system, protocol, provider replacement, public contract, or privacy default.
          required: true
